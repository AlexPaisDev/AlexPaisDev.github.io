# Refreshes assets/data/activity.json (the start page's "Patch notes" panel) once a day.
# Run it by hand from the Actions tab with "Run workflow".
name: Update GitHub activity

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/github_activity.py
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/data/activity.json
          git diff --cached --quiet || (git commit -m "Update GitHub activity" && git push)
